[project]
name = "cram"
version = "0.1.0"
description = "A local voice study assistant MCP server and Alexa+ simulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.26,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "strands-agents[openai]>=1.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
cram-server = "cram.server:main"
cram-web = "cram.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cram"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]