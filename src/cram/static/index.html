<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Cram</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Cram</h1>
        <p>A study assistant for Alexa+. This page simulates Alexa+ talking to the Cram server.</p>
      </header>

      <div class="workspace">
        <section class="chat" aria-labelledby="chat-heading">
          <h2 id="chat-heading">chat</h2>
          <div id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions"></div>

          <form id="chat-form" class="chat-form">
            <label for="message">your message</label>
            <div class="input-row">
              <input id="message" name="message" type="text" autocomplete="off" required>
              <button id="speak-button" type="button" hidden>Speak</button>
              <button id="send-button" type="submit">Send</button>
            </div>
            <label class="read-option">
              <input id="read-aloud" type="checkbox">
              <span>read replies aloud</span>
            </label>
          </form>

          <nav class="examples" aria-label="example messages">
            <a href="#" data-message="add notes about photosynthesis: plants turn light into sugar">add notes about photosynthesis: plants turn light into sugar</a>
            <a href="#" data-message="quiz me on photosynthesis">quiz me on photosynthesis</a>
            <a href="#" data-message="what should I review">what should I review</a>
          </nav>
          <p id="status" class="status" role="status"></p>
        </section>

        <aside class="notes" aria-labelledby="notes-heading">
          <h2 id="notes-heading">study material</h2>
          <form id="text-material-form" class="material-form">
            <label for="material-topic">topic</label>
            <input id="material-topic" name="topic" type="text" required maxlength="120" placeholder="for example, photosynthesis">
            <label for="material-text">paste your notes</label>
            <textarea id="material-text" name="text" rows="5" required maxlength="100000"></textarea>
            <button id="save-material-button" type="submit">save notes</button>
          </form>
          <form id="pdf-material-form" class="material-form">
            <label for="material-pdf">or add a text-based PDF</label>
            <input id="material-pdf" name="file" type="file" accept="application/pdf,.pdf" required>
            <button id="upload-pdf-button" type="submit">upload PDF</button>
            <p class="material-note">Scanned PDFs need OCR first. Maximum 10 MB and 100 pages.</p>
          </form>
          <p id="material-status" class="status" role="status" aria-live="polite"></p>
          <h3 class="saved-heading">saved topics</h3>
          <div id="topic-list" class="topic-list" aria-live="polite"></div>
          <button id="reset-button" type="button">reset conversation</button>
        </aside>
      </div>
    </main>
  </body>
</html>
